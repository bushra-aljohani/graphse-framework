[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphse"
version = "0.1.0"
description = "Reference implementation of a provenance-grounded agentic GraphRAG framework for software engineering education"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["graphse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
